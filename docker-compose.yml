version: "3.8"

services:
  # ----------------------------------------
  # PHP-FPM Application
  # ----------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hirfati-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini
    environment:
      APP_NAME: Hirfati
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: hirfati
      DB_USERNAME: hirfati
      DB_PASSWORD: secret

      REDIS_HOST: redis
      REDIS_PORT: "6379"

      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - hirfati-network

  # ----------------------------------------
  # Nginx Web Server
  # ----------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: hirfati-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - hirfati-network

  # ----------------------------------------
  # MySQL Database
  # ----------------------------------------
  mysql:
    image: mysql:8.0
    container_name: hirfati-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: hirfati
      MYSQL_USER: hirfati
      MYSQL_PASSWORD: secret
    volumes:
      - hirfati-mysql-data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - hirfati-network

  # ----------------------------------------
  # Redis Cache / Queue / Session Store
  # ----------------------------------------
  redis:
    image: redis:7.0-alpine
    container_name: hirfati-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - hirfati-redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - hirfati-network

# ==========================================
# Networks
# ==========================================
networks:
  hirfati-network:
    driver: bridge

# ==========================================
# Volumes
# ==========================================
volumes:
  hirfati-mysql-data:
    driver: local
  hirfati-redis-data:
    driver: local
